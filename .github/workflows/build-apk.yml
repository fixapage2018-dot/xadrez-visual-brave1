
name: Gerar APK Xadrez Visual Brave

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extrair projeto
        run: |
          unzip -q xadrez-visual-brave-dev-source.zip -d /tmp/projeto
          echo "PROJECT_DIR=/tmp/projeto/xadrez-visual-android-main" >> "$GITHUB_ENV"

      - name: Preparar Stockfish
        run: cd "$PROJECT_DIR" && python3 scripts/prepare_engine.py

      - name: Compilar APK
        run: cd "$PROJECT_DIR" && gradle :app:assembleDebug --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: XadrezVisual-Brave-APK
          path: /tmp/projeto/xadrez-visual-android-main/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          
